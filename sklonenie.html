<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Склонение глаголов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&display=swap">
<style>
/* Layout: sticky pronoun column on the left, verbs as columns, answer cells hidden until tapped. Gold from the lesson 8 palette. */
:root{
  --bg:#FBF6E8; --surface:#FFFFFF; --ink:#2B2418; --muted:#6A5F48; --line:#E6D9B0;
  --gold:#8A6510; --gold-soft:#F3E7BF; --green:#13795A; --wine:#7B2238; --hidden:#EFE4C0;
  --ar:'Amiri','Noto Naskh Arabic','Geeza Pro',serif; --body:'PT Sans','Segoe UI',Arial,sans-serif; --head:'PT Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1A12; --surface:#2A261A; --ink:#F2EBD6; --muted:#B9AE90; --line:#4A4228;
  --gold:#E3C66E; --gold-soft:#3B3418; --green:#5CCFA5; --wine:#F0A0B2; --hidden:#3A3318; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1A12; --surface:#2A261A; --ink:#F2EBD6; --muted:#B9AE90; --line:#4A4228;
  --gold:#E3C66E; --gold-soft:#3B3418; --green:#5CCFA5; --wine:#F0A0B2; --hidden:#3A3318; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--head);font-size:clamp(24px,4vw,34px);margin:0;color:var(--gold);text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:16px;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--gold);background:transparent;color:var(--gold);padding:8px 14px;border-radius:8px;font-weight:700;font-size:15px}
.btn:hover{background:var(--gold-soft)}
.btn.primary{background:var(--gold);color:var(--bg)}
.btn:focus-visible,.cell:focus-visible,.colh:focus-visible,.rowh:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.count{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
th,td{padding:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
tr:last-child th,tr:last-child td{border-bottom:0}
thead th{position:sticky;top:0;background:var(--surface);z-index:2}
.corner,.rowh-cell{position:sticky;left:0;background:var(--surface);border-left:0;min-width:130px;text-align:left;border-right:2px solid var(--gold)}
.rowh-cell{z-index:1}
.corner{z-index:4;padding:10px 12px;color:var(--muted);font-size:13px;font-weight:400}
.rowh,.colh{display:block;width:100%;border:0;background:transparent;color:inherit;text-align:center;padding:8px 10px}
.rowh{text-align:left}
.rowh .a{font-family:var(--ar);font-size:26px;font-weight:700;color:var(--wine);display:block;line-height:1.3}
.rowh .r{font-size:13px;color:var(--muted);display:block}
.colh .a{font-family:var(--ar);font-size:30px;font-weight:700;color:var(--gold);display:block;line-height:1.3}
.colh .r{font-size:13px;color:var(--muted);display:block}
.cell{display:flex;align-items:center;justify-content:center;width:100%;min-width:96px;height:62px;border:0;background:var(--hidden);color:var(--muted);font-family:var(--ar);font-size:26px;font-weight:700;transition:background .15s;direction:rtl;unicode-bidi:isolate}
.cell:hover{background:var(--gold-soft)}
.cell[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
::highlight(endc){color:var(--green)}
.hint{color:var(--muted);font-size:15px;margin:0}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
@media (max-width:520px){.rowh-cell,.corner{min-width:108px}.cell{min-width:84px}}
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Склонение глагола в прошедшем времени</h1>
      <p class="sub">Назови форму вслух, потом нажми на ячейку, чтобы проверить. Зелёным выделено окончание.</p>
    </div>
    <div class="bar">
      <span class="count" id="count" aria-live="polite"></span>
      <button class="btn primary" id="showAll" type="button">Показать всё</button>
      <button class="btn" id="hideAll" type="button">Скрыть всё</button>
      <button class="btn" id="mix" type="button">Перемешать глаголы</button>
    </div>
  </header>
  <div class="scroll"><table id="tbl"></table></div>
  <p class="hint">Нажми на глагол вверху, чтобы открыть весь столбец, или на местоимение слева, чтобы открыть всю строку.</p>
</div>
<script>
var PRON=[["هُوَ","он"],["هُمْ","они (м.)"],["هِيَ","она"],["هُنَّ","они (ж.)"],["أَنْتَ","ты (м.)"],["أَنْتُمْ","вы (м.)"],["أَنْتِ","ты (ж.)"],["أَنْتُنَّ","вы (ж.)"],["أَنَا","я"],["نَحْنُ","мы"]];
var END=["َ","ُوا","َتْ","ْنَ","ْتَ","ْتُمْ","ْتِ","ْتُنَّ","ْتُ","ْنَا"];
var VERBS=[["ذ","ه","ب","َ","пошёл"],["خ","ر","ج","َ","вышел"],["د","خ","ل","َ","вошёл"],["ج","ل","س","َ","сел"],["ك","ت","ب","َ","написал"],["ش","ر","ب","ِ","выпил"],["أ","ك","ل","َ","съел"],["ف","ت","ح","َ","открыл"],["س","م","ع","ِ","услышал"],["ف","ه","م","ِ","понял"],["غ","س","ل","َ","постирал"],["ل","ع","ب","ِ","поиграл"]];
var state={};var order=VERBS.map(function(_,i){return i});
function stem(v){return v[0]+"َ"+v[1]+v[3]+v[2];}
function build(){
  var t=document.getElementById("tbl");var h="<thead><tr><th class='corner' scope='col'>Местоимение</th>";
  order.forEach(function(vi){var v=VERBS[vi];h+="<th scope='col'><button class='colh' type='button' data-col='"+vi+"'><span class='a'>"+stem(v)+"َ</span><span class='r'>"+v[4]+"</span></button></th>";});
  h+="</tr></thead><tbody>";
  PRON.forEach(function(p,r){
    h+="<tr><th scope='row' class='rowh-cell'><button class='rowh' type='button' data-row='"+r+"'><span class='a'>"+p[0]+"</span><span class='r'>"+p[1]+"</span></button></th>";
    order.forEach(function(vi){var k=vi+"-"+r;var on=!!state[k];var v=VERBS[vi];
      var rootT=(r<4)?(v[0]+"َ"+v[1]+v[3]):stem(v);var full=(r<4)?(v[0]+"َ"+v[1]+v[3]+v[2]+END[r]):(stem(v)+END[r]);
      var txt=on?full:"؟";
      h+="<td><button class='cell' type='button' aria-pressed='"+on+"' data-e='"+(on?rootT.length:-1)+"' data-k='"+k+"' aria-label='"+VERBS[vi][4]+", "+p[1]+"'>"+txt+"</button></td>";});
    h+="</tr>";
  });
  t.innerHTML=h+"</tbody>";count();paint();
}
function paint(){
  if(!(window.CSS&&CSS.highlights&&window.Highlight))return;
  var rs=[];document.querySelectorAll('.cell').forEach(function(b){var n=+b.dataset.e;var tn=b.firstChild;if(n>=0&&tn&&tn.nodeType===3){var r=document.createRange();r.setStart(tn,n);r.setEnd(tn,tn.length);rs.push(r);}});
  CSS.highlights.set('endc',new Highlight(...rs));
}
function count(){var n=0;Object.keys(state).forEach(function(k){if(state[k])n++});document.getElementById("count").textContent="Открыто "+n+" из "+(order.length*PRON.length);}
document.getElementById("tbl").addEventListener("click",function(e){
  var c=e.target.closest(".cell"),col=e.target.closest(".colh"),row=e.target.closest(".rowh");
  if(c){state[c.dataset.k]=!state[c.dataset.k];}
  else if(col){var vi=col.dataset.col;var all=PRON.every(function(_,r){return state[vi+"-"+r]});PRON.forEach(function(_,r){state[vi+"-"+r]=!all});}
  else if(row){var r=+row.dataset.row;var all2=order.every(function(vi){return state[vi+"-"+r]});order.forEach(function(vi){state[vi+"-"+r]=!all2});}
  else return;
  var keep=document.querySelector(".scroll").scrollLeft;build();document.querySelector(".scroll").scrollLeft=keep;
});
document.getElementById("showAll").onclick=function(){order.forEach(function(vi){PRON.forEach(function(_,r){state[vi+"-"+r]=true})});build();};
document.getElementById("hideAll").onclick=function(){state={};build();};
document.getElementById("mix").onclick=function(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}state={};build();};
build();
</script>

</html>
